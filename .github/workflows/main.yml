name: Build and Release Go Application

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-dev*'

jobs:

  build-linux-amd64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/.golangci-lint/cache
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build Binary
        working-directory: ./src
        run: |
          mkdir -p ../artifacts
          go mod tidy
          GOOS=linux GOARCH=amd64 go build -o ../artifacts/bin ./pars.go

      - name: Archive Binary Build
        run: | 
          tar -czvf artifacts/pars-linux-amd64.bin.tar.gz -C artifacts/ bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v2
        with:
          name: linux-amd64-artifacts
          path: |
            artifacts/bin
            artifacts/pars-linux-amd64.bin.tar.gz

  create-release:
    needs: 
      # - build-windows-386
      # - build-windows-amd64
      # - build-linux-386
      - build-linux-amd64
      # - build-linux-arm
      # - build-linux-arm64
      # - build-darwin-amd64
      # - build-darwin-arm64
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.upload_url.outputs.data }}

    steps:

      - name: Get Tag Name
        id: get_tag_name
        run: |
          echo "Tag name is: ${{ github.ref }}"
          TAG_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/tags\///')
          echo "tag_name=$TAG_NAME" >> $GITHUB_ENV



      - name: Clone Downloads Repository
        run: |
          git clone https://github.com/parsdevkit/downloads.git


      - name: Read Changelog File
        id: changelog
        run: |
          changelog_file="downloads/contents/en/pars/changelogs/v1.0.164.md"
          if [ -f "$changelog_file" ]; then
            content=$(cat "$changelog_file")
            echo "changelog_content=$content" >> $GITHUB_ENV
          else
            echo "Changelog file not found for tag ${{ env.tag_name }}"
            exit 1
          fi


      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.tag_name }}
          release_name: Release ${{ env.tag_name }}
          body: ${{ env.changelog_content }}
          draft: true
          prerelease: false

      - name: Set Release Upload Url
        id: upload_url
        run: echo "::set-output name=data::${{ steps.create_release.outputs.upload_url }}"


  package-linux-amd64-deb:
    needs: 
      - build-linux-amd64
    runs-on: ubuntu-latest

    steps:
      - name: Get Tag Name
        id: get_tag_name
        run: |
          echo "Tag name is: ${{ github.ref }}"
          TAG_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/tags\///')
          echo "tag_name=$TAG_NAME" >> $GITHUB_ENV

          VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          echo "version=$VERSION" >> $GITHUB_ENV



      - name: Download Artifact
        uses: actions/download-artifact@v2
        with:
          name: linux-amd64-artifacts
          path: downloads


      - name: Build Package
        run: |
          # Create directories
          mkdir -p artifacts
          mkdir -p temp/deb/DEBIAN
          mkdir -p temp/deb/usr/bin
          
          # Copy files
          cp ./downloads/bin temp/deb/usr/bin/
          
          # Create control file
          cat <<EOF > temp/deb/DEBIAN/control
          Package: pars
          Version: ${VERSION}
          Section: base
          Priority: optional
          Architecture: amd64
          Depends: libc6 (>= 2.7)
          Maintainer: Pars Dev Kit <info@parsdevkit.net>
          Description: Pars
          A brief description of Pars.
          EOF
          
          # Create changelog file
          cat <<EOF > temp/deb/DEBIAN/changelog
          pars (${VERSION}-1) unstable; urgency=medium
          
            * Initial release.
          
          -- Pars Dev Kit <info@parsdevkit.net>  $(date -R)
          EOF
          
          # Create .changes file
          cat <<EOF > temp/pars-linux-amd64_${VERSION}-1_amd64.changes
          Source: pars
          Section: base
          Priority: optional
          Maintainer: Pars Dev Kit <info@parsdevkit.net>
          Build-Depends: debhelper (>= 9)
          Standards-Version: 4.1.4
          Format: 3.0 (quilt)
          Architecture: amd64
          Version: ${VERSION}-1
          Files:
          $(md5sum temp/pars-linux-amd64.deb | awk '{ print $1 }') temp/pars-linux-amd64.deb
          EOF
          
          # Build Packaeg
          dpkg-deb --build temp/deb temp/pars-linux-amd64.deb
          
          


      - name: Archive Package
        run: | 
          # Archieve
          tar -czvf artifacts/pars-linux-amd64.deb.tar.gz -C temp .

          # Clear
          rm -rf temp




      - name: Upload Artifact
        uses: actions/upload-artifact@v2
        with:
          name: linux-amd64-artifacts
          path: |
            artifacts/pars-linux-amd64.deb.tar.gz


  upload-linux-amd64-artifacts:
    needs: 
      - create-release
      - build-linux-amd64
      - package-linux-amd64-deb
      # - package-linux-amd64-rpm
    runs-on: ubuntu-latest

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v2
        with:
          name: linux-amd64-artifacts
          path: downloads


      - name: Upload Binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./downloads/pars-linux-amd64.bin.tar.gz
          asset_name: pars-linux-amd64.tar.gz
          asset_content_type: application/gzip

          
      - name: Upload DEB Package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./downloads/pars-linux-amd64.deb.tar.gz
          asset_name: pars-linux-amd64.deb.tar.gz
          asset_content_type: application/gzip



  publish_release:
    needs: 
      # - upload-windows-386-artifacts
      # - upload-windows-amd64-artifacts
      # - upload-linux-386-artifacts
      - upload-linux-amd64-artifacts
      # - upload-linux-arm-artifacts
      # - upload-linux-arm64-artifacts
      # - upload-darwin-amd64-artifacts
      # - upload-darwin-arm64-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Get Release ID
        id: get_release
        run: |
          release_id=$(curl \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.0.174 | jq -r '.id')
          echo "release_id=$release_id" >> $GITHUB_ENV

      - name: Publish Release (Remove Draft Status)
        run: |
          curl \
            -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/${{ env.release_id }} \
            -d '{"draft": false}'
